name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      # --all-packages reaches the rust/ workspace member; pytest collects its
      # suite too, so without it the run fails on an import rather than on
      # anything real. Nothing here needs a sibling checkout, precisely so this
      # works on a bare clone.
      - run: uv sync --all-extras --all-packages --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run ruff check src tests Makefile.py rust/src rust/tests
          uv run ruff format --check src tests Makefile.py rust/src rust/tests
      # tests/test_sources.py builds real wheels and runs real `uv sync`s to
      # prove a task package resolves from a path and from git. The git half
      # uses a local bare repo over file://, so the only thing it fetches is a
      # build backend on a cold cache.
      - name: Test
        run: uv run pytest
      # Startup latency is a feature: a command runner typed dozens of times an
      # hour gets abandoned if it stops feeling instant. tests/test_startup.py
      # enforces the budget; this prints the number so a regression is visible
      # in the log before it fails the build.
      - name: Startup latency
        run: uv run mk dev.bench

  # There was a `sibling` job here that proved `optersoft_make.box` re-exports
  # `hetzner_make.box` against a real hetzner checkout. It was removed on
  # 2026-08-24: `optersoft_make` left this repo on 2026-08-17 and the shim it
  # tested now lives in the private `make-optersoft`, which is where that test
  # belongs. It could not have passed here anyway -- it imported a package this
  # workspace no longer contains, and checked out `optersoft/hetzner`, which is
  # on the forge, not GitHub.
