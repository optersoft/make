[project]
name = "make-marketplace"
version = "0.1.0"
description = "VS Code Marketplace tasks for mkrun -- package an extension, check what is published, and cut a release CI publishes."
readme = "README.md"
requires-python = ">=3.11"
# Same dual licence as mkrun, for the same reason: this member is generic and
# publishable. The licence texts live at the repository root; a built wheel
# carries the SPDX expression, which is what PEP 639 asks for.
license = "MIT OR Apache-2.0"
authors = [{ name = "Optersoft, S.L.", email = "david@optersoft.com" }]
keywords = ["vscode", "marketplace", "vsce", "extension", "release", "mk", "mkrun"]
# Nothing but the runner: `vsce` is reached through `npx`, and the gallery query
# is one request through `make.http`. A publishing helper that made you install
# a Node toolchain to ask what version is live would be worse than the question.
dependencies = ["mkrun>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/make_marketplace"]

[project.urls]
Source = "https://github.com/optersoft/make/tree/main/marketplace"

# The runner is the other half of this repository, so resolve it from the
# working tree instead of PyPI, exactly as rust/ and cloudflare/ do.
[tool.uv.sources]
mkrun = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# No [tool.ruff] here on purpose: every member shares the root config, so they
# cannot drift apart by an isort option.
