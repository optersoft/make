[project]
name = "mkrun"
version = "0.4.0"
description = "A command runner whose tasks are Python functions -- shareable as versioned packages."
readme = "README.md"
requires-python = ">=3.11"
# Dual, at the user's choice -- the convention in this corner of the ecosystem
# (Rust, and `uv` itself, which this tool re-executes under). MIT alone is the
# shortest path for anyone who just wants the code; Apache-2.0 adds the two
# things a company asks for and MIT is silent on: an express patent grant that
# runs both ways (§3), and a statement that no trademark rights come with it
# (§6). Offering both costs a file and takes nothing away.
#
# An SPDX expression here, not the old `{ text = ... }` table: PEP 639, which
# also replaced the `License ::` classifiers -- keeping one alongside this is an
# error in current build backends, not a duplicate.
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Optersoft, S.L.", email = "david@optersoft.com" }]
keywords = ["task runner", "command runner", "just", "make", "mk", "uv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/optersoft/make"
Source = "https://github.com/optersoft/make"

# `mk`, and only `mk`. Installing a `make` script would shadow GNU make on the
# PATH of every Unix machine, which is a lot to take from a tool you installed
# for one repository -- and the short name is the one you want to type anyway.
# `mk` is not a builtin or default alias in bash, zsh or PowerShell. It is not
# unique (PyPI's `mk` and Plan 9 both use it) but it collides with almost
# nothing, where `make` collides with everything.
#
# The import name stays `make`, and so do the `Makefile.py` / `mk.py` recipe
# filenames. Anyone who wants the old spelling: alias make=mk
[project.scripts]
mk = "make.cli:console_main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/make"]

# An sdist defaults to the whole project directory, which here would ship the
# rust/ member to anyone running `pip download mkrun`. This distribution is
# the runner; the task packages are separate ones.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/make",
    "tests",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "pyproject.toml",
]

# Three distributions, one checkout: `mkrun` here at the root, and the two
# generic task packages -- cargo hygiene in rust/, Cloudflare Pages in
# cloudflare/. They are packaged separately -- see the sdist rule above -- but
# resolved and locked together, so a runner change and real tasks that exercise
# it land in one commit and one lockfile. A member is here only if it wraps a
# tool nobody in particular owns; anything else belongs beside the thing it
# drives. (optersoft's own make package was the original second member; it moved
# to the private optersoft/make-optersoft repo on 2026-08-17 so this repo can go
# public.)
[tool.uv.workspace]
members = ["rust", "cloudflare"]

[tool.pytest.ini_options]
testpaths = ["tests", "rust/tests", "cloudflare/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
# Every workspace member is first-party. Without their src dirs here, ruff sorts
# `make_rust` / `make_cloudflare` as third-party imports inside their own package.
src = ["src", "rust/src", "cloudflare/src"]

[tool.ruff.lint.isort]
# Paired with format.skip-magic-trailing-comma below; ruff warns if they disagree.
split-on-trailing-comma = false

[tool.ruff.format]
# Building an argv list is this tool's central idiom. Honouring the magic
# trailing comma explodes every `sh("cmd", "--flag", value)` to one token per
# line, which makes the command being run unreadable -- the opposite of the
# point. Packing to the line length keeps a command looking like a command.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: line length is handled by the formatter.
# B008: `field(default_factory=...)` and `arg(...)` in defaults are the point.
# RUF012: config sections are dataclasses; mutable defaults are declared properly.
# SIM117: nested `with` blocks read better when one is a pytest.raises assertion.
# RUF022: __all__ is grouped by role (authoring / output / types / errors),
#         which is more useful to a reader than alphabetical order.
ignore = ["E501", "B008", "RUF012", "SIM117", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately redefine names to exercise duplicate-registration errors.
# Both members' suites: patterns are matched against the path relative to this
# file, so `tests/**` alone would not reach the rust package.
"tests/**" = ["F811", "B006"]
"rust/tests/**" = ["F811", "B006"]
"cloudflare/tests/**" = ["F811", "B006"]
