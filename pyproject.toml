[project]
name = "mkrun"
version = "0.1.0"
description = "A command runner whose recipes are Python -- shareable as versioned packages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "optersoft", email = "david@optersoft.com" }]
keywords = ["task runner", "command runner", "just", "make", "recipes", "uv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/optersoft/make"
Source = "https://github.com/optersoft/make"

# `make` shadows GNU make on PATH -- a deliberate choice, with `mk` shipped as a
# non-shadowing alias for repos that also use a real Makefile.
[project.scripts]
make = "make.cli:console_main"
mk = "make.cli:console_main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/make"]

# An sdist defaults to the whole project directory, which here would ship
# optersoft's internal recipe package, the per-repo example configs and the
# migration notes to anyone running `pip download mkrun`. This distribution is
# the generic tool; the recipes are a separate one.
[tool.hatch.build.targets.sdist]
only-include = ["src/make", "tests", "README.md", "LICENSE", "pyproject.toml"]

# Two distributions, one checkout: `mkrun` here at the root, and optersoft's
# private recipe package in recipes/. They are packaged separately -- see the
# sdist rule above -- but resolved and locked together, so a runner change and
# the recipes that exercise it land in one commit and one lockfile.
[tool.uv.workspace]
members = ["recipes"]

[tool.pytest.ini_options]
testpaths = ["tests", "recipes/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
# Both workspace members are first-party. Without recipes/src here, ruff sorts
# `make_recipes_optersoft` as a third-party import inside its own package.
src = ["src", "recipes/src"]

[tool.ruff.lint.isort]
# Paired with format.skip-magic-trailing-comma below; ruff warns if they disagree.
split-on-trailing-comma = false

[tool.ruff.format]
# Building an argv list is this tool's central idiom. Honouring the magic
# trailing comma explodes every `sh("cmd", "--flag", value)` to one token per
# line, which makes the command being run unreadable -- the opposite of the
# point. Packing to the line length keeps a command looking like a command.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: line length is handled by the formatter.
# B008: `field(default_factory=...)` and `arg(...)` in defaults are the point.
# RUF012: config sections are dataclasses; mutable defaults are declared properly.
# SIM117: nested `with` blocks read better when one is a pytest.raises assertion.
# RUF022: __all__ is grouped by role (authoring / output / types / errors),
#         which is more useful to a reader than alphabetical order.
ignore = ["E501", "B008", "RUF012", "SIM117", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately redefine names to exercise duplicate-registration errors.
# Both members' suites: patterns are matched against the path relative to this
# file, so `tests/**` alone would not reach the recipes package.
"tests/**" = ["F811", "B006"]
"recipes/tests/**" = ["F811", "B006"]
