[project]
name = "make-recipes-optersoft"
version = "0.1.0"
description = "optersoft's shared recipes for `make` (mkrun) -- the successor to github.com/optersoft/just."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "optersoft", email = "david@optersoft.com" }]
dependencies = ["mkrun>=0.1"]

[project.optional-dependencies]
# Only `play.reviews` needs these; everything else shells out to a CLI.
play = ["google-auth>=2", "requests>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/make_recipes_optersoft"]

[project.urls]
Source = "https://github.com/optersoft/make/tree/main/recipes"

# The runner is the other half of this repository, so resolve it from the
# working tree instead of PyPI: a change to `mkrun` is testable against real
# recipes in the same commit that makes it. Consumers are unaffected -- a built
# wheel carries the plain `mkrun>=0.1` requirement above, because
# `tool.uv.sources` is workspace metadata and is not written into a distribution.
[tool.uv.sources]
mkrun = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# No [tool.ruff] here on purpose. Ruff walks up from each file to the nearest
# config, so both members share the root one -- which is how it should have been
# from the start: the two copies had already drifted apart by an isort option,
# and ruff warned about the half that was missing it.
